[advisories]
yanked = "warn"
# Keep these ignores in step with osv-scanner.toml (root and fuzz/) and the
# cargo audit flags in .github/workflows/ci.yaml. Scorecard's Vulnerabilities
# check reads only the OSV config.
ignore = [
    # rsa timing sidechannel (Marvin Attack) — no fix available upstream.
    # Reachable: murk accepts ssh-rsa recipients via `circle authorize`, `ssh:`,
    # and `github:username`. Risk is low (timing oracle requires many decryption
    # queries against a server; murk is a local CLI). Prefer ed25519 keys.
    # Revisit when the rsa crate ships a fix.
    "RUSTSEC-2023-0071",
    # basic-toml is unmaintained (archived upstream), no replacement release.
    # Not shipped: it only runs at compile time inside age's i18n-embed-fl and
    # i18n-embed-impl proc macros, which read age's own bundled i18n.toml, so
    # it never parses murk input. Drop this once age moves off i18n-config.
    "RUSTSEC-2026-0374",
    # crypto-bigint 0.5.5 timing variability in operations meant to be
    # constant-time; the fix (>= 0.7.6) needs elliptic-curve/p256 0.14, and
    # age 0.12.1 (latest) pins 0.13. Not reached: age uses P-256 only for its
    # native age1tag/age1tagpq recipients (encrypt side; age has no native tag
    # identity). murk parses recipients only as x25519, ssh or plugin, so an
    # age1tag key goes to an external age-plugin-tag process, and identities
    # only as x25519, ssh or plugin. Drop once an age release moves to
    # p256/elliptic-curve 0.14 and the lockfiles resolve crypto-bigint to 0.7.6
    # or later (0.7.5 is still affected). Upstream fix: rage main already uses
    # p256/hpke 0.14 (https://github.com/str4d/rage/pull/649).
    "RUSTSEC-2026-0387",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
