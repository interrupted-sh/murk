name: bb plugin

on:
  pull_request:
    paths:
      - "integrations/bb/**"
      - ".github/workflows/bb-plugin.yaml"
      # The suite runs this repo's murk CLI, so a change to murk itself runs it too.
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "node/**"
      - "rust-toolchain.toml"
      - ".github/actions/setup-rust/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # The check name. Dependabot updates of the plugin's npm tree wait for a
    # human review (scripts/automerge-policy.cjs), because branch protection
    # does not require this check.
    name: bb plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install
        working-directory: integrations/bb
        run: npm ci

      - name: Typecheck
        working-directory: integrations/bb
        run: npx tsc --noEmit

      # npm test builds this repo's murk CLI (debug) and puts it first on PATH.
      - name: Test
        working-directory: integrations/bb
        run: npm test
