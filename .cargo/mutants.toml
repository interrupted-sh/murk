# cargo-mutants configuration — https://mutants.rs/
#
# Mutation testing measures whether the suite CATCHES bugs, not merely that code
# runs. A surviving mutant is a change to the source that no test noticed — i.e.
# a test that asserts too little. It is the complement to the property tests in
# src/property_tests.rs: those assert the invariants, this proves the assertions
# have teeth.
#
# There are two profiles. This file is the lib profile: modules whose rules the
# lib's unit and property tests pin down, run against `--lib` only. The trust
# profile (.cargo/mutants-trust.toml) covers the trust and merge core, whose
# guards are often held only by the integration harness, and runs those suites.
#
# Run locally:   cargo mutants                                   (lib profile)
#                cargo mutants --config .cargo/mutants-trust.toml (trust profile)
# CI:            .github/workflows/mutants.yaml: both profiles weekly, sharded
#                to fit the 6-hour job limit; the trust profile nightly and on
#                pull requests for the code a diff touches.

# Key resolution (env), export scope/policy filtering + escaping, agent-grant
# creation/revoke (grants), recipient add/revoke — the who-can-decrypt surface
# (recipients), agent allow-tag enforcement (policy), secret
# add/rotate/group-scoping (secrets), group membership (groups), and the
# crypto core and key recovery.
examine_globs = [
    "src/crypto.rs",
    "src/recovery.rs",
    "src/env.rs",
    "src/export.rs",
    "src/grants.rs",
    "src/recipients.rs",
    "src/policy.rs",
    "src/secrets.rs",
    "src/groups.rs",
]

# Only the lib's unit + property tests need to run to catch mutants in this
# surface; skipping the slow integration/CLI tests keeps each mutant tractable.
additional_cargo_test_args = ["--lib"]

# The baseline lib suite runs in ~2s; give a slow-path (non-hanging) mutant room
# so it is scored as caught/missed, not miscounted as a timeout.
timeout_multiplier = 8.0

# Debug/Display formatting carries no security invariant — the identity Debug
# impls are deliberately lossy (they redact key material), so mutating them is
# noise. Everything else in these modules must be caught.
exclude_re = [
    "impl std::fmt::Debug",
    "impl std::fmt::Display",
]
